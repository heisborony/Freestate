<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freestate — Pricing intelligence for software</title>
<meta name="description" content="One dot tells you if any software is Free, Freemium, Bait, or Paid. A Chrome extension by Borony.">
<style>
  :root{--bg:#090909;--surface:#111;--border:#292929;--text:#F5F5F5;--muted:#737373;--free:#30D158;--freemium:#0A84FF;--bait:#FFD60A;--paid:#FF453A;--mono:"Geist Mono","JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{max-width:440px;width:100%;text-align:center}
  .dots{display:flex;gap:10px;justify-content:center;margin-bottom:28px}
  .dot{width:12px;height:12px;border-radius:50%}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:12px}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:28px}
  .cta{display:inline-block;background:var(--text);color:var(--bg);font-family:var(--sans);font-weight:600;font-size:15px;text-decoration:none;padding:13px 26px;border-radius:8px;transition:opacity .15s}
  .cta:hover{opacity:.85}
  .legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:32px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
  footer{margin-top:40px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="card">
    <div class="dots">
      <span class="dot" style="background:var(--free)"></span>
      <span class="dot" style="background:var(--freemium)"></span>
      <span class="dot" style="background:var(--bait)"></span>
      <span class="dot" style="background:var(--paid)"></span>
    </div>
    <h1>Is it actually free?</h1>
    <p>Freestate is a Chrome extension that tells you the truth about any software's pricing — Free, Freemium, Bait, or Paid — with evidence and sources.</p>
    <a class="cta" href="https://chrome.google.com/webstore" target="_blank" rel="noopener">Add to Chrome →</a>
    <div class="legend">
      <span><i style="background:var(--free)"></i>Free</span>
      <span><i style="background:var(--freemium)"></i>Freemium</span>
      <span><i style="background:var(--bait)"></i>Bait</span>
      <span><i style="background:var(--paid)"></i>Paid</span>
    </div>
    <footer>A <a href="https://borony.space" target="_blank" rel="noopener">Borony</a> project · <a href="/privacy.html">Privacy</a></footer>
  </div>
</body>
</html>
